<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easing Functions Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1e1e1e;
            color: #cccccc;
            overflow-x: hidden;
            min-height: 100vh;
            font-size: 13px;
        }

        .header {
            background: #2d2d30;
            padding: 12px 16px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 14px;
            font-weight: 400;
            color: #cccccc;
        }

        .header-controls {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            width: 24px;
            height: 24px;
            background: transparent;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cccccc;
            transition: background-color 0.2s ease;
        }

        .header-btn:hover {
            background: #3e3e42;
        }

        .toolbar {
            padding: 8px 16px;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .filter-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .filter-label {
            font-size: 12px;
            color: #cccccc;
            min-width: 32px;
        }

        .filter-input {
            flex: 1;
            padding: 4px 8px;
            background: #3c3c3c;
            border: 1px solid #464647;
            border-radius: 2px;
            color: #cccccc;
            font-size: 12px;
            outline: none;
        }

        .filter-input:focus {
            border-color: #007acc;
        }

        .filter-input::placeholder {
            color: #6c6c6c;
        }

        .star-btn {
            color: #6c6c6c;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .star-btn:hover {
            color: #007acc;
        }

        .category-tabs {
            display: flex;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #cccccc;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .category-tab:hover {
            background: #3e3e42;
        }

        .category-tab.active {
            color: #007acc;
            border-bottom-color: #007acc;
        }

        .easing-list {
            flex: 1;
            overflow-y: auto;
        }

        .easing-item {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-bottom: 1px solid #2d2d30;
            cursor: pointer;
            transition: background-color 0.2s ease;
            position: relative;
        }

        .easing-item:hover {
            background: #2a2d2e;
        }

        .easing-item.selected {
            background: #094771;
        }

        .easing-thumbnail {
            width: 40px;
            height: 40px;
            background: #3c3c3c;
            border-radius: 3px;
            margin-right: 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid #464647;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .easing-preview-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .preview-dot {
            width: 6px;
            height: 6px;
            background: #007acc;
            border-radius: 50%;
            position: absolute;
            transition: none;
            box-shadow: 0 0 4px rgba(0, 122, 204, 0.5);
        }

        .easing-info {
            flex: 1;
            min-width: 0;
        }

        .easing-name {
            font-size: 13px;
            color: #cccccc;
            font-weight: 400;
            margin-bottom: 2px;
        }

        .easing-type {
            font-size: 11px;
            color: #6c6c6c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .easing-description {
            font-size: 11px;
            color: #9c9c9c;
            margin-top: 2px;
            line-height: 1.3;
        }

        .easing-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .easing-item:hover .easing-actions {
            opacity: 1;
        }

        .action-btn {
            width: 20px;
            height: 20px;
            background: transparent;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cccccc;
            transition: background-color 0.2s ease;
        }

        .action-btn:hover {
            background: #3e3e42;
        }

        .star-favorite {
            color: #6c6c6c;
        }

        .star-favorite.active {
            color: #007acc;
        }

        .footer {
            background: #007acc;
            color: white;
            padding: 6px 16px;
            font-size: 11px;
            text-align: center;
            border-top: 1px solid #3e3e42;
        }

        .preview-section {
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            padding: 12px 16px;
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        .preview-title {
            font-size: 12px;
            color: #cccccc;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .duration-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }

        .duration-slider {
            width: 80px;
            height: 4px;
            background: #3c3c3c;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
        }

        .duration-slider::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #007acc;
            cursor: pointer;
        }

        .duration-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #007acc;
            cursor: pointer;
            border: none;
        }

        .preview-demo {
            height: 60px;
            background: #3c3c3c;
            border-radius: 3px;
            border: 1px solid #464647;
            position: relative;
            overflow: hidden;
        }

        .demo-ball {
            width: 12px;
            height: 12px;
            background: #007acc;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 6px;
            transform: translateY(-50%);
            box-shadow: 0 0 8px rgba(0, 122, 204, 0.5);
        }

        .code-preview {
            background: #1e1e1e;
            border: 1px solid #464647;
            border-radius: 3px;
            padding: 8px;
            margin-top: 8px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 10px;
            color: #d4d4d4;
            overflow-x: auto;
            max-height: 100px;
            overflow-y: auto;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2d2d30;
        }

        ::-webkit-scrollbar-thumb {
            background: #464647;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }

        /* Animation states */
        .animating .preview-dot {
            animation: easingPreview 2s infinite;
        }

        @keyframes easingPreview {
            0% { left: 2px; }
            50% { left: calc(100% - 8px); }
            100% { left: 2px; }
        }

        /* Syntax highlighting */
        .token-keyword { color: #569cd6; }
        .token-function { color: #dcdcaa; }
        .token-number { color: #b5cea8; }
        .token-operator { color: #d4d4d4; }
        .token-variable { color: #9cdcfe; }
        .token-math { color: #4ec9b0; }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-title">Easing Functions</span>
        <div class="header-controls">
            <button class="header-btn" title="Refresh">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M13.5 2v3.5h-3.5M8 2.5a5.5 5.5 0 1 1-5.5 5.5M2.5 8h3m8-3-3 3"/>
                </svg>
            </button>
            <button class="header-btn" title="Settings">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 2v1m0 10v1m6-6h-1M3 8H2m11.485-3.485l-.707.707M4.222 11.778l-.707.707m7.07-7.07l.707-.707M4.222 4.222l-.707-.707"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="toolbar">
        <div class="filter-container">
            <span class="filter-label">Filter</span>
            <input type="text" class="filter-input" id="filterInput" placeholder="Search easing functions...">
        </div>
        <div class="star-btn" id="starBtn" title="Show favorites only">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25z"/>
            </svg>
        </div>
    </div>

    <div class="category-tabs">
        <button class="category-tab active" data-category="all">All</button>
        <button class="category-tab" data-category="quad">Quad</button>
        <button class="category-tab" data-category="cubic">Cubic</button>
        <button class="category-tab" data-category="quart">Quart</button>
        <button class="category-tab" data-category="sine">Sine</button>
        <button class="category-tab" data-category="expo">Expo</button>
        <button class="category-tab" data-category="circ">Circ</button>
        <button class="category-tab" data-category="back">Back</button>
        <button class="category-tab" data-category="elastic">Elastic</button>
        <button class="category-tab" data-category="bounce">Bounce</button>
    </div>

    <div class="preview-section" id="previewSection">
        <div class="preview-title">
            <span>Live Preview</span>
            <div class="duration-control">
                <span>Duration:</span>
                <input type="range" class="duration-slider" id="durationSlider" min="0.5" max="3" step="0.1" value="1.5">
                <span id="durationValue">1.5s</span>
            </div>
        </div>
        <div class="preview-demo">
            <div class="demo-ball" id="demoBall"></div>
        </div>
        <div class="code-preview" id="codePreview">
            <span class="token-keyword">function</span> <span class="token-function">easeInOutQuad</span>(<span class="token-variable">x</span>: <span class="token-keyword">number</span>): <span class="token-keyword">number</span> {<br>
            &nbsp;&nbsp;<span class="token-keyword">return</span> <span class="token-variable">x</span> &lt; <span class="token-number">0.5</span> ? <span class="token-number">2</span> * <span class="token-variable">x</span> * <span class="token-variable">x</span> : <span class="token-number">1</span> - <span class="token-math">Math.pow</span>(-<span class="token-number">2</span> * <span class="token-variable">x</span> + <span class="token-number">2</span>, <span class="token-number">2</span>) / <span class="token-number">2</span>;<br>
            }
        </div>
    </div>

    <div class="easing-list" id="easingList">
        <!-- Easing items will be populated by JavaScript -->
    </div>

    <div class="footer">
        Click an easing function to apply to selected AE keyframes
    </div>

    <script>
        // Easing Functions Library
        const easingFunctions = {
            linear: x => x,
            
            easeInQuad: x => x * x,
            easeOutQuad: x => 1 - (1 - x) * (1 - x),
            easeInOutQuad: x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2,
            
            easeInCubic: x => x * x * x,
            easeOutCubic: x => 1 - Math.pow(1 - x, 3),
            easeInOutCubic: x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
            
            easeInQuart: x => x * x * x * x,
            easeOutQuart: x => 1 - Math.pow(1 - x, 4),
            easeInOutQuart: x => x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2,
            
            easeInQuint: x => x * x * x * x * x,
            easeOutQuint: x => 1 - Math.pow(1 - x, 5),
            easeInOutQuint: x => x < 0.5 ? 16 * x * x * x * x * x : 1 - Math.pow(-2 * x + 2, 5) / 2,
            
            easeInSine: x => 1 - Math.cos((x * Math.PI) / 2),
            easeOutSine: x => Math.sin((x * Math.PI) / 2),
            easeInOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
            
            easeInExpo: x => x === 0 ? 0 : Math.pow(2, 10 * (x - 1)),
            easeOutExpo: x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x),
            easeInOutExpo: x => {
                if (x === 0) return 0;
                if (x === 1) return 1;
                return x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
            },
            
            easeInCirc: x => 1 - Math.sqrt(1 - Math.pow(x, 2)),
            easeOutCirc: x => Math.sqrt(1 - Math.pow(x - 1, 2)),
            easeInOutCirc: x => x < 0.5 
                ? (1 - Math.sqrt(1 - Math.pow(2 * x, 2))) / 2
                : (Math.sqrt(1 - Math.pow(-2 * x + 2, 2)) + 1) / 2,
            
            easeInBack: x => {
                const c1 = 1.70158;
                const c3 = c1 + 1;
                return c3 * x * x * x - c1 * x * x;
            },
            easeOutBack: x => {
                const c1 = 1.70158;
                const c3 = c1 + 1;
                return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
            },
            easeInOutBack: x => {
                const c1 = 1.70158;
                const c2 = c1 * 1.525;
                return x < 0.5
                    ? (Math.pow(2 * x, 2) * ((c2 + 1) * 2 * x - c2)) / 2
                    : (Math.pow(2 * x - 2, 2) * ((c2 + 1) * (x * 2 - 2) + c2) + 2) / 2;
            },
            
            easeInElastic: x => {
                const c4 = (2 * Math.PI) / 3;
                if (x === 0) return 0;
                if (x === 1) return 1;
                return -Math.pow(2, 10 * x - 10) * Math.sin((x * 10 - 10.75) * c4);
            },
            easeOutElastic: x => {
                const c4 = (2 * Math.PI) / 3;
                if (x === 0) return 0;
                if (x === 1) return 1;
                return Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
            },
            easeInOutElastic: x => {
                const c5 = (2 * Math.PI) / 4.5;
                if (x === 0) return 0;
                if (x === 1) return 1;
                return x < 0.5
                    ? -(Math.pow(2, 20 * x - 10) * Math.sin((20 * x - 11.125) * c5)) / 2
                    : (Math.pow(2, -20 * x + 10) * Math.sin((20 * x - 11.125) * c5)) / 2 + 1;
            },
            
            easeInBounce: x => 1 - easingFunctions.easeOutBounce(1 - x),
            easeOutBounce: x => {
                const n1 = 7.5625;
                const d1 = 2.75;
                if (x < 1 / d1) {
                    return n1 * x * x;
                } else if (x < 2 / d1) {
                    return n1 * (x -= 1.5 / d1) * x + 0.75;
                } else if (x < 2.5 / d1) {
                    return n1 * (x -= 2.25 / d1) * x + 0.9375;
                } else {
                    return n1 * (x -= 2.625 / d1) * x + 0.984375;
                }
            },
            easeInOutBounce: x => x < 0.5
                ? (1 - easingFunctions.easeOutBounce(1 - 2 * x)) / 2
                : (1 + easingFunctions.easeOutBounce(2 * x - 1)) / 2
        };

        // Define categories and descriptions
        const easingData = {
            linear: { category: 'linear', type: 'LINEAR', description: 'Constant speed throughout' },
            
            easeInQuad: { category: 'quad', type: 'QUAD', description: 'Slow start, accelerating' },
            easeOutQuad: { category: 'quad', type: 'QUAD', description: 'Fast start, decelerating' },
            easeInOutQuad: { category: 'quad', type: 'QUAD', description: 'Slow start and end' },
            
            easeInCubic: { category: 'cubic', type: 'CUBIC', description: 'Gradual acceleration' },
            easeOutCubic: { category: 'cubic', type: 'CUBIC', description: 'Gradual deceleration' },
            easeInOutCubic: { category: 'cubic', type: 'CUBIC', description: 'Smooth acceleration and deceleration' },
            
            easeInQuart: { category: 'quart', type: 'QUART', description: 'Strong acceleration' },
            easeOutQuart: { category: 'quart', type: 'QUART', description: 'Strong deceleration' },
            easeInOutQuart: { category: 'quart', type: 'QUART', description: 'Strong ease in and out' },
            
            easeInQuint: { category: 'quint', type: 'QUINT', description: 'Very strong acceleration' },
            easeOutQuint: { category: 'quint', type: 'QUINT', description: 'Very strong deceleration' },
            easeInOutQuint: { category: 'quint', type: 'QUINT', description: 'Very strong ease in and out' },
            
            easeInSine: { category: 'sine', type: 'SINE', description: 'Gentle acceleration' },
            easeOutSine: { category: 'sine', type: 'SINE', description: 'Gentle deceleration' },
            easeInOutSine: { category: 'sine', type: 'SINE', description: 'Very gentle ease in and out' },
            
            easeInExpo: { category: 'expo', type: 'EXPO', description: 'Exponential acceleration' },
            easeOutExpo: { category: 'expo', type: 'EXPO', description: 'Exponential deceleration' },
            easeInOutExpo: { category: 'expo', type: 'EXPO', description: 'Exponential ease in and out' },
            
            easeInCirc: { category: 'circ', type: 'CIRC', description: 'Circular acceleration' },
            easeOutCirc: { category: 'circ', type: 'CIRC', description: 'Circular deceleration' },
            easeInOutCirc: { category: 'circ', type: 'CIRC', description: 'Circular ease in and out' },
            
            easeInBack: { category: 'back', type: 'BACK', description: 'Backs up before moving forward' },
            easeOutBack: { category: 'back', type: 'BACK', description: 'Overshoots then settles' },
            easeInOutBack: { category: 'back', type: 'BACK', description: 'Backs up and overshoots' },
            
            easeInElastic: { category: 'elastic', type: 'ELASTIC', description: 'Elastic wind-up effect' },
            easeOutElastic: { category: 'elastic', type: 'ELASTIC', description: 'Elastic spring-back effect' },
            easeInOutElastic: { category: 'elastic', type: 'ELASTIC', description: 'Elastic wind-up and spring-back' },
            
            easeInBounce: { category: 'bounce', type: 'BOUNCE', description: 'Bouncing acceleration' },
            easeOutBounce: { category: 'bounce', type: 'BOUNCE', description: 'Bouncing deceleration' },
            easeInOutBounce: { category: 'bounce', type: 'BOUNCE', description: 'Bouncing ease in and out' }
        };

        let favorites = new Set();
        let selectedEasing = null;
        let currentFilter = '';
        let currentCategory = 'all';
        let showFavoritesOnly = false;
        let currentAnimationDuration = 1.5;

        // Create canvas for easing curve preview
        function createEasingCanvas(easingFunc, name) {
            const canvas = document.createElement('canvas');
            canvas.className = 'easing-preview-canvas';
            canvas.width = 40;
            canvas.height = 40;
            
            const ctx = canvas.getContext('2d');
            
            // Draw grid
            ctx.strokeStyle = '#464647';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 40; i += 10) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 40);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(40, i);
                ctx.stroke();
            }
            
            // Draw easing curve with proper scaling
            ctx.strokeStyle = '#007acc';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            
            // Sample more points for smoother curves
            const points = [];
            for (let i = 0; i <= 100; i++) {
                const progress = i / 100;
                const easedProgress = easingFunc(progress);
                points.push({ x: progress, y: easedProgress });
            }
            
            // Find the actual range of the eased values for proper scaling
            const minY = Math.min(...points.map(p => p.y));
            const maxY = Math.max(...points.map(p => p.y));
            const range = maxY - minY;
            const padding = range * 0.1; // 10% padding
            
            const scaleY = (value) => {
                if (range === 0) return 20; // Center if no variation
                return 40 - ((value - minY + padding) / (range + 2 * padding)) * 40;
            };
            
            for (let i = 0; i <= 100; i++) {
                const point = points[i];
                const x = (point.x * 38) + 1; // 1px padding on sides
                const y = scaleY(point.y);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            return canvas;
        }

        // Create animated dot for preview
        function createPreviewDot() {
            const dot = document.createElement('div');
            dot.className = 'preview-dot';
            return dot;
        }

        // Create easing item
        function createEasingItem(name, func) {
            const data = easingData[name];
            const item = document.createElement('div');
            item.className = 'easing-item';
            item.dataset.name = name.toLowerCase();
            item.dataset.category = data.category;
            
            const thumbnail = document.createElement('div');
            thumbnail.className = 'easing-thumbnail';
            thumbnail.appendChild(createEasingCanvas(func, name));
            thumbnail.appendChild(createPreviewDot());
            
            const info = document.createElement('div');
            info.className = 'easing-info';
            
            const nameEl = document.createElement('div');
            nameEl.className = 'easing-name';
            nameEl.textContent = name;
            
            const typeEl = document.createElement('div');
            typeEl.className = 'easing-type';
            typeEl.textContent = data.type;
            
            const descEl = document.createElement('div');
            descEl.className = 'easing-description';
            descEl.textContent = data.description;
            
            info.appendChild(nameEl);
            info.appendChild(typeEl);
            info.appendChild(descEl);
            
            const actions = document.createElement('div');
            actions.className = 'easing-actions';
            
            const starBtn = document.createElement('button');
            starBtn.className = 'action-btn star-favorite';
            starBtn.innerHTML = `
                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25z"/>
                </svg>
            `;
            starBtn.onclick = (e) => {
                e.stopPropagation();
                toggleFavorite(name, starBtn);
            };
            
            actions.appendChild(starBtn);
            
            item.appendChild(thumbnail);
            item.appendChild(info);
            item.appendChild(actions);
            
            // Add click handler
            item.onclick = () => selectEasing(name, func, item);
            
            // Add hover animation
            item.onmouseenter = () => {
                thumbnail.classList.add('animating');
                animatePreviewDot(thumbnail.querySelector('.preview-dot'), func);
            };
            
            item.onmouseleave = () => {
                thumbnail.classList.remove('animating');
            };
            
            return item;
        }

        // Animate preview dot
        function animatePreviewDot(dot, easingFunc) {
            let startTime = null;
            const duration = 2000; // 2 seconds
            
            function animate(currentTime) {
                if (!startTime) startTime = currentTime;
                const elapsed = currentTime - startTime;
                const progress = (elapsed % duration) / duration;
                
                // Apply the actual easing function
                const easedProgress = easingFunc(progress);
                
                // Calculate position (2px to 30px within 40px thumbnail)
                const left = 2 + (easedProgress * 28);
                dot.style.left = left + 'px';
                dot.style.top = '50%';
                dot.style.transform = 'translateY(-50%)';
                
                // Continue animation while element is hovered
                if (dot.parentElement && dot.parentElement.classList.contains('animating')) {
                    requestAnimationFrame(animate);
                }
            }
            
            requestAnimationFrame(animate);
        }

        // Toggle favorite
        function toggleFavorite(name, btn) {
            if (favorites.has(name)) {
                favorites.delete(name);
                btn.classList.remove('active');
            } else {
                favorites.add(name);
                btn.classList.add('active');
            }
            
            // Save to localStorage
            localStorage.setItem('easingFavorites', JSON.stringify([...favorites]));
        }

        // Select easing function
        function selectEasing(name, func, element) {
            // Remove previous selection
            document.querySelectorAll('.easing-item.selected').forEach(item => {
                item.classList.remove('selected');
            });
            
            // Add selection to current item
            element.classList.add('selected');
            selectedEasing = { name, func };
            
            // Show preview section
            const previewSection = document.getElementById('previewSection');
            previewSection.classList.add('active');
            
            // Update demo and code
            updateDemo(name, func);
            updateCodePreview(name, func);
            
            // Apply to After Effects
            applyEasingToAE(name, func);
        }

        // Update demo animation
        function updateDemo(name, func) {
            const demoBall = document.getElementById('demoBall');
            const durationSlider = document.getElementById('durationSlider');
            const duration = parseFloat(durationSlider.value) * 1000; // Convert to milliseconds
            
            // Reset position
            demoBall.style.transition = 'none';
            demoBall.style.transform = 'translateY(-50%) translateX(6px)';
            
            // Start custom animation with easing function
            let startTime = null;
            let isAnimating = true;
            
            function animate(currentTime) {
                if (!startTime) startTime = currentTime;
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Apply the selected easing function
                const easedProgress = func(progress);
                
                // Calculate position (6px to container width - 18px)
                const container = demoBall.parentElement;
                const maxX = container.offsetWidth - 18; // Account for ball size
                const x = 6 + (easedProgress * (maxX - 6));
                
                demoBall.style.transform = `translateY(-50%) translateX(${x}px)`;
                
                if (progress < 1 && isAnimating) {
                    requestAnimationFrame(animate);
                } else if (progress >= 1) {
                    // Animation complete, auto-restart after a pause
                    setTimeout(() => {
                        if (selectedEasing && selectedEasing.name === name) {
                            updateDemo(name, func);
                        }
                    }, 500);
                }
            }
            
            // Store reference to stop animation when switching functions
            demoBall.stopAnimation = () => { isAnimating = false; };
            
            requestAnimationFrame(animate);
        }

        // Update code preview with syntax highlighting
        function updateCodePreview(name, func) {
            const codePreview = document.getElementById('codePreview');
            const funcString = func.toString();
            const formattedCode = formatFunctionCode(name, funcString);
            codePreview.innerHTML = formattedCode;
        }

        // Format function code with syntax highlighting
        function formatFunctionCode(name, funcString) {
            let code = funcString
                .replace(/function\s*\(/g, '<span class="token-keyword">function</span> <span class="token-function">' + name + '</span>(')
                .replace(/=>/g, '<span class="token-operator">=></span>')
                .replace(/\breturn\b/g, '<span class="token-keyword">return</span>')
                .replace(/\bconst\b/g, '<span class="token-keyword">const</span>')
                .replace(/\blet\b/g, '<span class="token-keyword">let</span>')
                .replace(/\bif\b/g, '<span class="token-keyword">if</span>')
                .replace(/(\d+\.?\d*)/g, '<span class="token-number">$1</span>')
                .replace(/(Math\.\w+)/g, '<span class="token-math">$1</span>')
                .replace(/\bx\b/g, '<span class="token-variable">x</span>');
            
            return `<span class="token-keyword">function</span> <span class="token-function">${name}</span>(<span class="token-variable">x</span>: <span class="token-keyword">number</span>): <span class="token-keyword">number</span> {<br>&nbsp;&nbsp;${code.split('=>')[1]?.trim() || code}<br>}`;
        }

        // Update footer message
        function updateFooter(message) {
            const footer = document.querySelector('.footer');
            footer.textContent = message;
            
            setTimeout(() => {
                footer.textContent = 'Click an easing function to apply to selected AE keyframes';
            }, 3000);
        }

        // Filter functions
        function filterItems() {
            const items = document.querySelectorAll('.easing-item');
            
            items.forEach(item => {
                const name = item.dataset.name;
                const category = item.dataset.category;
                const isFavorited = favorites.has(name);
                
                const matchesFilter = name.includes(currentFilter);
                const matchesCategory = currentCategory === 'all' || category === currentCategory;
                const matchesFavorites = !showFavoritesOnly || isFavorited;
                
                if (matchesFilter && matchesCategory && matchesFavorites) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Initialize the panel
        function initPanel() {
            const easingList = document.getElementById('easingList');
            
            // Load favorites from localStorage
            const savedFavorites = localStorage.getItem('easingFavorites');
            if (savedFavorites) {
                favorites = new Set(JSON.parse(savedFavorites));
            }
            
            // Create items for each easing function
            Object.entries(easingFunctions).forEach(([name, func]) => {
                const item = createEasingItem(name, func);
                easingList.appendChild(item);
                
                // Set favorite state
                if (favorites.has(name)) {
                    const starBtn = item.querySelector('.star-favorite');
                    starBtn.classList.add('active');
                }
            });
            
            // Setup filter input
            const filterInput = document.getElementById('filterInput');
            filterInput.addEventListener('input', (e) => {
                currentFilter = e.target.value.toLowerCase();
                filterItems();
            });
            
            // Setup category tabs
            const categoryTabs = document.querySelectorAll('.category-tab');
            categoryTabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    // Update active tab
                    categoryTabs.forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    currentCategory = e.target.dataset.category;
                    filterItems();
                });
            });
            
            // Setup star filter button
            const starBtn = document.getElementById('starBtn');
            starBtn.addEventListener('click', () => {
                showFavoritesOnly = !showFavoritesOnly;
                starBtn.style.color = showFavoritesOnly ? '#007acc' : '#6c6c6c';
                filterItems();
            });
            
            // Setup duration slider
            const durationSlider = document.getElementById('durationSlider');
            const durationValue = document.getElementById('durationValue');
            
            durationSlider.addEventListener('input', (e) => {
                const duration = parseFloat(e.target.value);
                currentAnimationDuration = duration;
                durationValue.textContent = duration + 's';
                
                // Restart current animation with new duration
                if (selectedEasing) {
                    const demoBall = document.getElementById('demoBall');
                    if (demoBall.stopAnimation) {
                        demoBall.stopAnimation();
                    }
                    updateDemo(selectedEasing.name, selectedEasing.func);
                }
            });
            
            // Select default easing
            const defaultItem = document.querySelector('[data-name="easeinoutquad"]');
            if (defaultItem) {
                defaultItem.click();
            }
        }

        // Handle CEP events
        if (typeof CSInterface !== 'undefined') {
            const csInterface = new CSInterface();
            
            // Theme change event
            csInterface.addEventListener(CSInterface.THEME_COLOR_CHANGED_TYPE, onThemeColorChanged);
            
            function onThemeColorChanged(event) {
                // Update panel colors based on AE theme
                const skinInfo = JSON.parse(window.__adobe_cep__.getHostEnvironment()).appSkinInfo;
                updateTheme(skinInfo);
            }
            
            function updateTheme(skinInfo) {
                // Apply theme colors to match After Effects
                const panelBg = toHex(skinInfo.panelBackgroundColor);
                const appBg = toHex(skinInfo.appBarBackgroundColor);
                
                document.documentElement.style.setProperty('--panel-bg', panelBg);
                document.documentElement.style.setProperty('--app-bg', appBg);
            }
            
            function toHex(color) {
                const r = Math.round(color.red).toString(16).padStart(2, '0');
                const g = Math.round(color.green).toString(16).padStart(2, '0');
                const b = Math.round(color.blue).toString(16).padStart(2, '0');
                return `#${r}${g}${b}`;
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', initPanel);
    </script>
